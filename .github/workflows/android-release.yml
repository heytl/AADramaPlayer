name: Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/android-release-ci

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TZ: Asia/Shanghai
      EXPECTED_SIGNING_SHA256: 321ff5fdc3519a114aed48993a839c83a06f78dc72e317f602867bb5910ff46a

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK packages
        shell: bash
        run: |
          if [[ -z "${ANDROID_HOME:-}" ]]; then
            echo "::error::ANDROID_HOME is not set by the runner image" >&2
            exit 1
          fi
          sdkmanager_path="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager_path" ]]; then
            echo "::error::Android SDK manager is missing or not executable: $sdkmanager_path" >&2
            exit 1
          fi
          "$sdkmanager_path" --sdk_root="$ANDROID_HOME" --install "platforms;android-35" "build-tools;34.0.0"

      - name: Restore release signing configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          umask 077
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          required = (
              "KEYSTORE_BASE64", "KEYSTORE_PASSWORD",
              "KEY_ALIAS", "KEY_PASSWORD",
          )
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit("Missing signing secrets: " + ", ".join(missing))

          key_data = base64.b64decode(os.environ["KEYSTORE_BASE64"], validate=True)
          if not key_data:
              raise SystemExit("Decoded keystore is empty")
          key_file = Path("app/JKS/my-release-key.jks")
          key_file.parent.mkdir(parents=True, exist_ok=True)
          key_file.write_bytes(key_data)

          # Java Properties.load(InputStream) expects ISO-8859-1 or Unicode escapes.
          # Encode UTF-16 code units so all password characters round-trip safely.
          def escape(value):
              raw = value.encode("utf-16-be")
              return "".join(
                  "\\u" + raw[i:i + 2].hex()
                  for i in range(0, len(raw), 2)
              )

          mapping = {
              "signing.storePassword": "KEYSTORE_PASSWORD",
              "signing.keyAlias": "KEY_ALIAS",
              "signing.keyPassword": "KEY_PASSWORD",
          }
          contents = "".join(
              f"{prop}={escape(os.environ[secret])}\n"
              for prop, secret in mapping.items()
          )
          Path("local.properties").write_text(contents, encoding="ascii")
          PY

      - name: Build signed release APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Verify release APK signature and certificate
        shell: bash
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if (( ${#apks[@]} == 0 )); then
            echo "No release APK was produced" >&2
            exit 1
          fi
          for apk in "${apks[@]}"; do
            report="$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$apk")"
            printf '%s\n' "$report"
            digest="$(printf '%s\n' "$report" | awk '/^Signer #1 certificate SHA-256 digest:/ {print $NF}' | tr '[:upper:]' '[:lower:]')"
            if [[ "$digest" != "$EXPECTED_SIGNING_SHA256" ]]; then
              echo "Release APK certificate does not match the existing local release certificate" >&2
              exit 1
            fi
          done

      - name: Upload verified release APK
        uses: actions/upload-artifact@v7
        with:
          name: AA-Drama-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload R8 mapping
        uses: actions/upload-artifact@v7
        with:
          name: AA-Drama-release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Remove signing files
        if: always()
        run: rm -f app/JKS/my-release-key.jks local.properties
